[project]
name = "hicad-lsp"
version = "0.1.0"
description = "HiCAD Language Server"
readme = "README.md"
authors = [
  { name = "patrick.joerg", email = "patrick.joerg@gilgends.com" },
  { name = "manuel.stallnig", email = "manuel.stallnig@suter-schneider.ch" },
]
requires-python = ">=3.12"
dependencies = ["pygls==2.1.1", "lsprotocol==2025.0.0"]

[project.scripts]
hicad-lsp = "hicad_lsp.server:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
